name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]
    tags: [ep2]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # nginx -t valida la sintaxis; los --add-host evitan que falle por no encontrar los servicios
      - name: Validar nginx.conf
        run: |
          docker run --rm \
            --add-host front:127.0.0.1 --add-host dominio1:127.0.0.1 \
            --add-host dominio2:127.0.0.1 --add-host ia:127.0.0.1 \
            -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/gateway
          flavor: latest=false               # latest solo lo pone la regla de abajo (push a main)
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
