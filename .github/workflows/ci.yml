name: CI/CD Pipeline - Gateway

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]
    tags: ['ep3']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: franalarcon24/gateway

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Construir imagen
      run: docker build -t gateway-test .
    - name: Validar nginx.conf (con una clave de prueba, no la real)
      run: docker run --rm -e API_KEY=clave-de-prueba-ci-123456 gateway-test nginx -t
    - name: Sin API_KEY el gateway no debe arrancar
      run: |
        if docker run --rm gateway-test nginx -t; then
          echo "ERROR: el gateway arranco sin API_KEY"; exit 1
        fi
    - name: Tests 401 / 429 / 413
      run: bash tests/test_gateway.sh gateway-test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=sha,prefix=sha-
          type=ref,event=tag
          type=raw,value=latest,enable={{is_default_branch}}
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64
        cache-from: type=gha
        cache-to: type=gha,mode=max

