# API gateway de Nexo: la única puerta de entrada al sistema (puerto 8080).
#   /               -> front
#   /api/dominio/   -> microservicio de dominio, balanceado entre 2 réplicas
#   /api/ia/        -> microservicio de IA
#   /health         -> healthcheck del propio gateway

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Log con la réplica que atendió y el tiempo de respuesta
    log_format gateway '$remote_addr "$request" $status '
                       'upstream=$upstream_addr '
                       'tiempo=$request_time s upstream_tiempo=$upstream_response_time s';

    # DNS interno de Docker. Con "resolve", Nginx vuelve a preguntar la IP de cada servicio
    # cada 5 s: si un contenedor se reinicia con otra IP, el gateway la encuentra solo,
    # y si un contenedor está detenido, su nombre desaparece y Nginx deja de enviarle peticiones.
    # "resolve" en upstream existe en Nginx open source desde la 1.27.3 y necesita "zone".
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream front_up {
        zone front_up 64k;
        server front:8000 resolve;
    }

    # Balanceo round-robin entre las 2 réplicas de dominio.
    # Health check pasivo: si una réplica falla 1 vez, queda fuera 10 s.
    upstream dominio_up {
        zone dominio_up 64k;
        server dominio1:8000 max_fails=1 fail_timeout=10s resolve;
        server dominio2:8000 max_fails=1 fail_timeout=10s resolve;
    }

    upstream ia_up {
        zone ia_up 64k;
        server ia:8000 max_fails=1 fail_timeout=10s resolve;
    }

    server {
        listen 8080;
        access_log /var/log/nginx/access.log gateway;

        # Qué réplica respondió: curl.exe -si http://localhost:8080/api/dominio/health
        add_header X-Upstream $upstream_addr always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;

        # Si una réplica no responde (contenedor detenido o colgado), se reintenta en la otra.
        # Un POST solo se reintenta si no alcanzó a enviarse.
        # No se incluye http_503: si la IA está caída, el dominio responde 503 a propósito;
        # contarlo como falla sacaría a las dos réplicas sanas del balanceo durante 10 s.
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;

        # Si Nginx no logra hablar con un servicio, responde JSON en vez de su página HTML.
        # Sin proxy_intercept_errors: los errores que el propio servicio responde
        # (por ejemplo, el {"detail": ...} del dominio) llegan intactos al front.
        error_page 502 503 504 = @servicio_no_disponible;

        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","servicio":"gateway"}';
        }

        location /api/dominio/ {
            proxy_pass http://dominio_up/;     # /api/dominio/usuarios -> /usuarios
        }

        location /api/ia/ {
            proxy_pass http://ia_up/;          # /api/ia/predict -> /predict
        }

        location / {
            proxy_pass http://front_up;
        }

        location @servicio_no_disponible {
            default_type application/json;
            return 503 '{"detail":"El servicio no está disponible en este momento. Intenta de nuevo en unos segundos."}';
        }
    }
}