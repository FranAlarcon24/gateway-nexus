# =============================================================================
# GATEWAY NGINX - NEXO RECOMMENDER SYSTEM
# =============================================================================
# Único punto de entrada al sistema. Enruta:
# - / -> Front (Streamlit)
# - /api/ia/* -> Microservicio de IA
# - /api/dominio/* -> Microservicio de Dominio
# =============================================================================

events {
    worker_connections 1024;
}

http {
    # Configuración de upstream para balanceo de carga
    upstream front_servers {
        server front:8501;
    }

    upstream ia_servers {
        # Balanceo round-robin entre réplicas
        server ia:8000;
    }

    upstream dominio_servers {
        # Balanceo round-robin entre réplicas
        server dominio:8000;
        server dominio2:8000;
    }

    # Configuración de logs
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Configuración de compresión
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Servidor principal
    server {
        listen 8080;
        server_name localhost;

        # Health check del gateway
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Front (Streamlit)
        location / {
            proxy_pass http://front_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 86400;
        }

        # Microservicio de IA
        location /api/ia/ {
            proxy_pass http://ia_servers/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts para predicciones
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # Métricas del microservicio de IA
        location /api/ia/metrics {
            proxy_pass http://ia_servers/metrics;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Microservicio de Dominio
        location /api/dominio/ {
            proxy_pass http://dominio_servers/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # Manejo de errores
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
